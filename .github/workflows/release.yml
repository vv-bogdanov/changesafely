name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "1"
  NO_COLOR: "1"

jobs:
  publish:
    name: npm and GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js and npm registry
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.4"
          cache: pip
          cache-dependency-path: test/fixtures/python-project/requirements-test.txt
      - name: Install pinned Python benchmark dependencies
        run: python -m pip install --requirement test/fixtures/python-project/requirements-test.txt
      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5.4"
          tools: composer:2.9.5
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Match tag and package version
        run: npm run release:check
      - name: Run release gates
        run: npm run ci
      - name: Verify registry signatures and attestations
        run: npm run security:signatures
      - name: Create release artifacts directory
        run: mkdir artifacts
      - name: Build npm tarball
        run: npm pack --pack-destination artifacts
      - name: Generate CycloneDX SBOM
        run: npm sbom --omit dev --sbom-format cyclonedx > "artifacts/changesafely-${GITHUB_REF_NAME#v}.sbom.cdx.json"
      - name: Generate checksums
        run: sha256sum artifacts/*.tgz > artifacts/SHA256SUMS
      - name: Publish to npm with trusted publishing
        run: npm publish artifacts/*.tgz
      - name: Create immutable-ready GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --generate-notes --title "ChangeSafely ${GITHUB_REF_NAME#v}"
